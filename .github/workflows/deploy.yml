name: Build and deploy

on:
  push:
    branches: [main]
  # Also build on pull requests so a change is validated, linted and compiled
  # BEFORE it reaches main. Without this the first signal that a PR is broken
  # would be a failed deploy after merging it.
  pull_request:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN permissions needed by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel-in-progress is false so an in-flight
# deploy finishes rather than leaving Pages in a half-updated state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Runs the question-bank validator first: a bad bank fails the build
      # rather than deploying broken questions.
      - run: npm run validate

      # Logic tests for the scheduler and transfer modules. These import the
      # real source files, so a regression in the spaced-repetition schedule or
      # the progress merge fails the build rather than shipping.
      - run: npm test

      - run: npm run lint

      - run: npm run build:only

      # Publishing steps are skipped on pull requests: a PR should prove the
      # build is sound without pushing anything live.
      #
      # enablement: true turns Pages on if it isn't already. Without it the very
      # first deploy on a new repository fails with a bare "Not Found", because
      # the workflow runs before anyone has visited Settings → Pages. That is
      # exactly what happened on the first deploy here.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The live site: quiz.peteowen.dev on Cloudflare, serving the same build plus
  # the sync API. The GitHub Pages copy above stays up only to hand old
  # visitors' progress over and redirect them (src/lib/handoff.js).
  cloudflare:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:only
      # Migrations first: new code must never run against an older schema.
      - run: npx wrangler d1 migrations apply know-it-all --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
