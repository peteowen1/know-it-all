<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#15131f" />
    <script>
      // Apply the saved look and light/dark mode before first paint, so the
      // page never flashes the default. src/lib/theme.js owns these keys.
      (function () {
        var d = document.documentElement, look, mode;
        try {
          look = localStorage.getItem('kia_look');
          mode = localStorage.getItem('kia_mode');
        } catch (e) {}
        if (['riso', 'chalk', 'evening', 'broadsheet', 'showtime'].indexOf(look) < 0) look = 'riso';
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        d.dataset.look = look;
        d.dataset.mode = mode;
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Libre+Franklin:wght@400;500;600;700&family=UnifrakturMaguntia&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&family=Bungee&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

    <title>Know-It-All</title>
    <meta
      name="description"
      content="Trivia training: 1,500+ weekend-quiz questions with explanations, plus flags, capitals, charts, films, TV, Four by four and Fill the list."
    />
    <meta property="og:title" content="Know-It-All" />
    <meta
      property="og:description"
      content="Weekend-quiz questions, flags, capitals and more. Tracks what you get wrong and drills it back."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Offline support. Only registered over https (i.e. the deployed site) —
      // on the local dev server it would cache stale assets and confuse HMR.
      //
      // Failure is not surfaced to the user, because the app works online
      // regardless. It is logged, because the same rejection covers genuine
      // developer faults — a syntax error in sw.js, a wrong path, a bad MIME
      // type from the host — which would otherwise be invisible after a deploy
      // unless someone thought to open DevTools.
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((err) => {
            console.warn('Service worker registration failed; offline mode unavailable.', err);
          });
        });
      }
    </script>
  </body>
</html>
